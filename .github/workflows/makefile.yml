name: Examplar experiment

on:
  push:
    branches: [2026-experiment]
  pull_request:
    branches: [2026-experiment]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:pyret
      - run: npm ci --ignore-scripts && make phaseA
        working-directory: pyret
      - run: npm run build:local
      - run: npm test
      - run: CHROME_PATH=$(command -v google-chrome) npm run test:browser
